name: CI/CD - Sign Language API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only permissions. The Hugging Face token is supplied as a secret.
permissions:
  contents: read

jobs:
  ci:
    name: Validate application and container
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and Git LFS model
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU inference dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Verify model can load
        run: |
          python - <<'PY'
          from app.config import get_settings
          from app.predictor import SignLanguagePredictor

          predictor = SignLanguagePredictor(get_settings())
          predictor.load_model()
          assert predictor.model is not None
          print("Model loaded successfully for CI.")
          PY

      - name: Build Docker image
        run: docker build --tag sign-language-api:ci .

  deploy-to-hugging-face:
    name: Deploy Docker Space to Hugging Face
    needs: ci
    # Deploy only after a successful push to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and Git LFS model
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Validate Hugging Face deployment configuration
        id: hf_config
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Prefer a complete ID when configured; otherwise build it from the
          # separate variables already used by this repository.
          if [ -z "$HF_SPACE_ID" ] && [ -n "$HF_USERNAME" ] && [ -n "$HF_SPACE_NAME" ]; then
            HF_SPACE_ID="$HF_USERNAME/$HF_SPACE_NAME"
          fi
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Set either HF_SPACE_ID (username/space-name), or both HF_USERNAME and HF_SPACE_NAME as GitHub Actions variables."
            exit 1
          fi
          if ! [[ "$HF_SPACE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::HF_SPACE_ID must be in the form username/space-name. Received an invalid value."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret HF_TOKEN. Add a Hugging Face write token."
            exit 1
          fi
          echo "space_id=$HF_SPACE_ID" >> "$GITHUB_OUTPUT"

      - name: Sync repository to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ steps.hf_config.outputs.space_id }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
